<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NuevaCasa</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="grid-overlay"></span>
  </div>

  <div class="shell">
    <header class="site-header">
      <div class="logo">
        <svg class="logo-mark" width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="markGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#5eead4" />
              <stop offset="1" stop-color="#0891b2" />
            </linearGradient>
          </defs>
          <path d="M10,18 L20,6 L30,18 C31,23 27,29 20,35 C13,29 9,23 10,18 Z" fill="url(#markGrad)" />
          <path d="M13,18 H27" stroke="#05080a" stroke-width="1.6" stroke-linecap="round" />
          <circle cx="20" cy="24.5" r="3" fill="#05080a" />
          <path d="M31,7 L32.3,9.7 L35,11 L32.3,12.3 L31,15 L29.7,12.3 L27,11 L29.7,9.7 Z" fill="#5eead4" />
        </svg>
        <h1>Nueva<span class="accent">Casa</span></h1>
      </div>
      <p class="subtitle">Buscador agregado de propiedades</p>
    </header>

    <main>
      <form id="filtros-form" class="panel">
        <div class="filtros-primarios">
          <div class="campo">
            <label for="operacion">Operacion</label>
            <select id="operacion" name="operacion">
              <option value="venta">Venta</option>
              <option value="alquiler">Alquiler</option>
            </select>
          </div>

          <div class="campo">
            <label for="tipo_propiedad">Tipo</label>
            <select id="tipo_propiedad" name="tipo_propiedad">
              <option value="departamento">Departamento</option>
              <option value="casa">Casa</option>
              <option value="ph">PH</option>
              <option value="local">Local</option>
            </select>
          </div>

          <div class="campo">
            <label for="provincia">Provincia</label>
            <select id="provincia"></select>
          </div>

          <div class="campo">
            <label for="ubicacion">Zona</label>
            <select id="ubicacion" name="ubicacion"></select>
          </div>

          <div class="campo">
            <label for="precio_min">Precio min</label>
            <input type="number" id="precio_min" name="precio_min" />
          </div>

          <div class="campo">
            <label for="precio_max">Precio max</label>
            <input type="number" id="precio_max" name="precio_max" />
          </div>

          <div class="campo">
            <label for="ambientes_min">Ambientes min</label>
            <input type="number" id="ambientes_min" name="ambientes_min" />
          </div>

          <div class="campo">
            <label for="publicado_max_dias" title="Solo MercadoLibre/ZonaProp traen esta fecha">Publicado</label>
            <select id="publicado_max_dias" name="publicado_max_dias">
              <option value="">Cualquier fecha</option>
              <option value="1">Ultimas 24hs</option>
              <option value="7">Ultima semana</option>
              <option value="30">Ultimo mes</option>
            </select>
          </div>

          <div class="campo campo-checkbox">
            <span class="campo-label-spacer" aria-hidden="true">Publicado</span>
            <label for="filtro-especial-operacion" class="switch-label">
              <span class="switch">
                <input type="checkbox" id="filtro-especial-operacion" />
                <span class="switch-track"><span class="switch-thumb"></span></span>
              </span>
              <span id="filtro-especial-operacion-label">Apto credito</span>
            </label>
          </div>
        </div>

        <button type="button" id="toggle-mas-filtros" class="link-btn">
          <span class="link-btn-icon">+</span><span class="link-btn-label">Mas filtros</span>
        </button>

        <fieldset id="mas-filtros" hidden>
          <legend>Filtros avanzados</legend>

          <div class="campo">
            <label for="moneda">Moneda</label>
            <select id="moneda" name="moneda">
              <option value="">Cualquiera</option>
              <option value="USD">USD</option>
              <option value="ARS">ARS</option>
            </select>
          </div>

          <div class="campo">
            <label for="ambientes_max">Ambientes max</label>
            <input type="number" id="ambientes_max" name="ambientes_max" />
          </div>

          <div class="campo">
            <label for="dormitorios_min">Dormitorios min</label>
            <input type="number" id="dormitorios_min" name="dormitorios_min" />
          </div>

          <div class="campo">
            <label for="dormitorios_max">Dormitorios max</label>
            <input type="number" id="dormitorios_max" name="dormitorios_max" />
          </div>

          <div class="campo">
            <label for="superficie_min">Superficie min (m&sup2;)</label>
            <input type="number" id="superficie_min" name="superficie_min" />
          </div>

          <div class="campo">
            <label for="superficie_max">Superficie max (m&sup2;)</label>
            <input type="number" id="superficie_max" name="superficie_max" />
          </div>

          <div class="campo">
            <label for="antiguedad_max">Antiguedad max (anios)</label>
            <input type="number" id="antiguedad_max" name="antiguedad_max" />
          </div>

          <div class="campo">
            <label for="expensas_max">Expensas max</label>
            <input type="number" id="expensas_max" name="expensas_max" />
          </div>

          <div class="campo campo-checkbox">
            <label for="con_cochera" class="switch-label">
              <span class="switch">
                <input type="checkbox" id="con_cochera" name="con_cochera" />
                <span class="switch-track"><span class="switch-thumb"></span></span>
              </span>
              Con cochera <span class="hint">solo ZonaProp</span>
            </label>
          </div>

          <div class="campo campo-checkbox">
            <label for="con_patio" class="switch-label">
              <span class="switch">
                <input type="checkbox" id="con_patio" name="con_patio" />
                <span class="switch-track"><span class="switch-thumb"></span></span>
              </span>
              Con patio <span class="hint">solo ZonaProp</span>
            </label>
          </div>

          <div class="campo campo-checkbox">
            <label for="con_terraza" class="switch-label">
              <span class="switch">
                <input type="checkbox" id="con_terraza" name="con_terraza" />
                <span class="switch-track"><span class="switch-thumb"></span></span>
              </span>
              Con terraza <span class="hint">solo ZonaProp</span>
            </label>
          </div>

          <div class="campo campo-checkbox">
            <label for="con_jardin" class="switch-label">
              <span class="switch">
                <input type="checkbox" id="con_jardin" name="con_jardin" />
                <span class="switch-track"><span class="switch-thumb"></span></span>
              </span>
              Con jardin <span class="hint">solo ZonaProp</span>
            </label>
          </div>

          <div class="campo">
            <label for="orden">Ordenar por</label>
            <select id="orden" name="orden">
              <option value="relevancia">Relevancia</option>
              <option value="precio_asc">Precio: menor a mayor</option>
              <option value="precio_desc">Precio: mayor a menor</option>
              <option value="mas_recientes">Mas recientes</option>
            </select>
          </div>
        </fieldset>

        <button type="submit" class="btn-buscar">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="2" />
            <line x1="12.4" y1="12.4" x2="17" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          Buscar propiedades
        </button>
      </form>

      <section id="estado-portales" class="portales-status"></section>
      <section id="resultados" class="resultados-grid"></section>
      <nav id="paginacion" class="paginacion" hidden></nav>
    </main>

    <footer class="site-footer">NuevaCasa &middot; datos de portales de terceros</footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
