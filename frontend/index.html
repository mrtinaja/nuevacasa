<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NuevaCasa</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="grid-overlay"></span>
  </div>

  <div class="shell">
    <header class="site-header">
      <div class="logo">
        <svg class="logo-mark" width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="markGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#5eead4" />
              <stop offset="1" stop-color="#0891b2" />
            </linearGradient>
          </defs>
          <path d="M8 20L20 9L32 20" stroke="url(#markGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M12 17V29C12 29.5523 12.4477 30 13 30H27C27.5523 30 28 29.5523 28 29V17" stroke="url(#markGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="24.5" cy="24.5" r="4" stroke="#05080a" stroke-width="4.5" fill="#05080a" />
          <circle cx="24.5" cy="24.5" r="4" stroke="url(#markGrad)" stroke-width="1.6" fill="none" />
          <line x1="27.4" y1="27.4" x2="30" y2="30" stroke="url(#markGrad)" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <h1>Nueva<span class="accent">Casa</span></h1>
      </div>
      <p class="subtitle">Buscador agregado de propiedades</p>
      <p class="tagline">El mercado <span class="accent">cruzado</span>, no portal por portal.</p>
    </header>

    <main>
      <form id="filtros-form" class="panel">
        <div class="filtros-primarios">
          <div class="campo">
            <label for="operacion">Operacion</label>
            <select id="operacion" name="operacion">
              <option value="venta">Venta</option>
              <option value="alquiler">Alquiler</option>
            </select>
          </div>

          <div class="campo">
            <label for="tipo_propiedad">Tipo</label>
            <select id="tipo_propiedad" name="tipo_propiedad">
              <option value="departamento">Departamento</option>
              <option value="casa">Casa</option>
              <option value="ph">PH</option>
              <option value="local">Local</option>
            </select>
          </div>

          <div class="campo">
            <label for="provincia">Provincia</label>
            <select id="provincia"></select>
          </div>

          <div class="campo">
            <label for="ubicacion">Zona</label>
            <select id="ubicacion" name="ubicacion"></select>
          </div>

          <div class="campo">
            <label for="precio_min">Precio min</label>
            <input type="text" inputmode="numeric" class="input-precio" id="precio_min" name="precio_min" />
          </div>

          <div class="campo">
            <label for="precio_max">Precio max</label>
            <input type="text" inputmode="numeric" class="input-precio" id="precio_max" name="precio_max" />
          </div>

          <div class="campo">
            <label for="ambientes_min">Ambientes min</label>
            <input type="number" id="ambientes_min" name="ambientes_min" />
          </div>

          <div class="campo">
            <label for="publicado_max_dias" title="Solo MercadoLibre/ZonaProp traen esta fecha">Publicado</label>
            <select id="publicado_max_dias" name="publicado_max_dias">
              <option value="">Cualquier fecha</option>
              <option value="1">Ultimas 24hs</option>
              <option value="7">Ultima semana</option>
              <option value="30">Ultimo mes</option>
            </select>
          </div>

          <div class="campo campo-checkbox">
            <span class="campo-label-spacer" aria-hidden="true">Publicado</span>
            <label for="filtro-especial-operacion" class="switch-label">
              <span class="switch">
                <input type="checkbox" id="filtro-especial-operacion" />
                <span class="switch-track"><span class="switch-thumb"></span></span>
              </span>
              <span id="filtro-especial-operacion-label">Apto credito</span>
            </label>
          </div>
        </div>

        <button type="button" id="toggle-mas-filtros" class="link-btn">
          <span class="link-btn-icon">+</span><span class="link-btn-label">Mas filtros</span>
        </button>

        <fieldset id="mas-filtros" hidden>
          <legend>Filtros avanzados</legend>

          <div class="campo">
            <label for="moneda">Moneda</label>
            <select id="moneda" name="moneda">
              <option value="">Cualquiera</option>
              <option value="USD">USD</option>
              <option value="ARS">ARS</option>
            </select>
          </div>

          <div class="campo">
            <label for="ambientes_max">Ambientes max</label>
            <input type="number" id="ambientes_max" name="ambientes_max" />
          </div>

          <div class="campo">
            <label for="dormitorios_min">Dormitorios min</label>
            <input type="number" id="dormitorios_min" name="dormitorios_min" />
          </div>

          <div class="campo">
            <label for="dormitorios_max">Dormitorios max</label>
            <input type="number" id="dormitorios_max" name="dormitorios_max" />
          </div>

          <div class="campo">
            <label for="superficie_min">Superficie min (m&sup2;)</label>
            <input type="number" id="superficie_min" name="superficie_min" />
          </div>

          <div class="campo">
            <label for="superficie_max">Superficie max (m&sup2;)</label>
            <input type="number" id="superficie_max" name="superficie_max" />
          </div>

          <div class="campo">
            <label for="antiguedad_max">Antiguedad max (anios)</label>
            <input type="number" id="antiguedad_max" name="antiguedad_max" />
          </div>

          <div class="campo">
            <label for="expensas_max">Expensas max</label>
            <input type="text" inputmode="numeric" class="input-precio" id="expensas_max" name="expensas_max" />
          </div>

          <div class="campo">
            <label for="distancia_general_paz_max_km" title="Solo ZonaProp/RE-MAX traen coordenadas reales">Distancia max a Gral. Paz (km)</label>
            <input type="number" id="distancia_general_paz_max_km" name="distancia_general_paz_max_km" min="0" step="0.5" />
          </div>

          <div class="campo campo-checkbox">
            <label for="con_cochera" class="switch-label">
              <span class="switch">
                <input type="checkbox" id="con_cochera" name="con_cochera" />
                <span class="switch-track"><span class="switch-thumb"></span></span>
              </span>
              Con cochera <span class="hint">solo ZonaProp</span>
            </label>
          </div>

          <div class="campo campo-checkbox">
            <label for="con_patio" class="switch-label">
              <span class="switch">
                <input type="checkbox" id="con_patio" name="con_patio" />
                <span class="switch-track"><span class="switch-thumb"></span></span>
              </span>
              Con patio <span class="hint">solo ZonaProp</span>
            </label>
          </div>

          <div class="campo campo-checkbox">
            <label for="con_terraza" class="switch-label">
              <span class="switch">
                <input type="checkbox" id="con_terraza" name="con_terraza" />
                <span class="switch-track"><span class="switch-thumb"></span></span>
              </span>
              Con terraza <span class="hint">solo ZonaProp</span>
            </label>
          </div>

          <div class="campo campo-checkbox">
            <label for="con_jardin" class="switch-label">
              <span class="switch">
                <input type="checkbox" id="con_jardin" name="con_jardin" />
                <span class="switch-track"><span class="switch-thumb"></span></span>
              </span>
              Con jardin <span class="hint">solo ZonaProp</span>
            </label>
          </div>

          <div class="campo">
            <label for="orden">Ordenar por</label>
            <select id="orden" name="orden">
              <option value="relevancia">Relevancia</option>
              <option value="precio_asc">Precio: menor a mayor</option>
              <option value="precio_desc">Precio: mayor a menor</option>
              <option value="mas_recientes">Mas recientes</option>
            </select>
          </div>
        </fieldset>

        <button type="submit" class="btn-buscar">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="2" />
            <line x1="12.4" y1="12.4" x2="17" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          Buscar propiedades
        </button>
      </form>

      <section id="estado-portales" class="portales-status"></section>

      <div id="delitos-zona" class="delitos-zona" hidden></div>

      <section id="destacados-wrap" class="destacados-wrap" hidden>
        <h2 class="destacados-titulo">Mejores precios de esta zona</h2>
        <div class="destacados-carrusel">
          <button type="button" class="destacados-flecha destacados-flecha-izq" aria-label="Anterior">&larr;</button>
          <div id="destacados" class="destacados-row"></div>
          <button type="button" class="destacados-flecha destacados-flecha-der" aria-label="Siguiente">&rarr;</button>
        </div>
      </section>

      <div id="toggle-vista" class="toggle-vista">
        <button type="button" class="toggle-vista-btn is-activo" data-vista="lista">
          <svg class="toggle-vista-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="4" y="5" width="16" height="2.6" rx="1.3" fill="currentColor" />
            <rect x="4" y="10.7" width="16" height="2.6" rx="1.3" fill="currentColor" />
            <rect x="4" y="16.4" width="16" height="2.6" rx="1.3" fill="currentColor" />
          </svg>
          <span class="toggle-vista-texto">
            <span class="toggle-vista-titulo">Lista</span>
            <span class="toggle-vista-subtitulo">Tarjetas con todos los datos</span>
          </span>
        </button>
        <button type="button" class="toggle-vista-btn toggle-vista-btn-mapa" data-vista="mapa">
          <svg class="toggle-vista-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 4.5L4.3 6.3v13.2L9 17.7l6 2.1 4.7-1.8V4.8L15 6.6l-6-2.1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            <path d="M9 4.5v13.2M15 6.6v13.2" stroke="currentColor" stroke-width="1.6" />
          </svg>
          <span class="toggle-vista-texto">
            <span class="toggle-vista-titulo">Mapa</span>
            <span class="toggle-vista-subtitulo">Satelite y zonas de riesgo</span>
          </span>
        </button>
      </div>

      <section id="resultados" class="resultados-grid"></section>
      <div id="mapa-nota" class="mapa-nota" hidden></div>
      <div id="mapa-wrap" class="mapa-wrap" hidden>
        <div id="mapa" class="mapa-resultados"></div>
        <div class="toggle-capa">
          <button type="button" class="toggle-capa-btn is-activo" data-capa="calles">Calles</button>
          <button type="button" class="toggle-capa-btn" data-capa="satelite">Satelite</button>
        </div>
        <button type="button" id="toggle-delitos" class="toggle-delitos-btn" title="Mostrar/ocultar el color de delitos por zona">
          <span class="punto-leyenda punto-bajo"></span><span class="punto-leyenda punto-medio"></span><span class="punto-leyenda punto-alto"></span>
          Delitos por zona
        </button>
      </div>
      <nav id="paginacion" class="paginacion" hidden></nav>
    </main>

    <footer class="site-footer">NuevaCasa &middot; datos de portales de terceros</footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
